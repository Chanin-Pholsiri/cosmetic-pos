services:
  db:
    image: postgres:16-alpine
    container_name: cosmetic-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cosmetic
      POSTGRES_PASSWORD: cosmetic_secret
      POSTGRES_DB: cosmetic_pos
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmetic -d cosmetic_pos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
